services:
  postgres:
    image: postgres:16.10
    container_name: nexo-postgres

    environment:
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: nexo_password
      POSTGRES_DB: nexo

    ports:
      - "127.0.0.1:5435:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo -d nexo"]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped

volumes:
  postgres_data:
