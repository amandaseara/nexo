services:
  postgres:
    image: postgres:16.10
    container_name: nexo-postgres

    environment:
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: nexo_password
      POSTGRES_DB: nexo

    ports:
      - "127.0.0.1:5435:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo -d nexo"]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile

    image: nexo-api:0.3.0
    container_name: nexo-api

    environment:
      APP_NAME: NEXO
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://nexo:nexo_password@postgres:5432/nexo

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

volumes:
  postgres_data:
