apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.database.password | quote }}
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s-postgres:%v/%s" .Values.database.user .Values.database.password .Release.Name .Values.database.port .Values.database.name | quote }}
