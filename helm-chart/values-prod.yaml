replicaCount: 3

app:
  environment: production

image:
  repository: your-registry/nexo-api
  tag: "0.3.1"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

ingress:
  enabled: true
  className: nginx
  host: nexo.example.com

database:
  storage: 10Gi
