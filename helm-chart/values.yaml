replicaCount: 2

image:
  repository: ghcr.io/amandaseara/nexo-api
  tag: "0.4.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

app:
  name: NEXO
  environment: development

database:
  name: nexo
  user: nexo
  existingSecret: nexo-secret
  image: postgres:16.10
  storage: 1Gi
  port: 5432

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

initContainerResources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

postgresResources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 5
  liveness:
    initialDelaySeconds: 20
    periodSeconds: 10

ingress:
  enabled: false
  className: nginx
  host: nexo.local

metrics:
  # La API expone métricas Prometheus en este path
  enabled: true
  path: /metrics
  serviceMonitor:
    # Solo se crea si el clúster tiene la CRD de Prometheus Operator
    # (la instala scripts/monitoring-up.sh con kube-prometheus-stack)
    enabled: true
    interval: 15s
    scrapeTimeout: 10s
    labels:
      release: monitoring

migration:
  enabled: true
  revision: "e6a64989b8f6"
