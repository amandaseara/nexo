# Rompe la política 3: no pide runAsNonRoot (correría como root).
apiVersion: v1
kind: Pod
metadata:
  name: bad-root
  namespace: nexo
  labels:
    purpose: kyverno-test
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 50m, memory: 32Mi}
