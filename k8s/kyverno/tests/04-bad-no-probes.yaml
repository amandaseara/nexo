# Rompe la política 4: Deployment sin readinessProbe ni livenessProbe.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-no-probes
  namespace: nexo
  labels:
    purpose: kyverno-test
spec:
  replicas: 1
  selector:
    matchLabels: {app: bad-no-probes}
  template:
    metadata:
      labels: {app: bad-no-probes}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 50m, memory: 32Mi}
