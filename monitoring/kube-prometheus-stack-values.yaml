# Valores para prometheus-community/kube-prometheus-stack (chart 93.9.0)
# Instalación: scripts/monitoring-up.sh

# Minikube no expone etcd, scheduler, controller-manager ni kube-proxy:
# se desactivan para no tener targets caídos.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

# No se usa en este trabajo; ahorra recursos en Minikube.
alertmanager:
  enabled: false

prometheus:
  prometheusSpec:
    # Descubre los ServiceMonitor/PodMonitor/reglas de cualquier namespace
    # sin exigir la etiqueta "release" del chart.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    scrapeInterval: 15s
    evaluationInterval: 15s
    retention: 2d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

grafana:
  # Credenciales en un Secret creado por scripts/monitoring-up.sh
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # El chart ya crea el datasource "Prometheus" (uid: prometheus)
  # apuntando al Prometheus del stack.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  defaultDashboardsTimezone: browser
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
